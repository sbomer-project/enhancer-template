{% raw %}apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "{% endraw %}example-enhancer-chart{% raw %}.fullname" . }}
  labels:
    {{- include "{% endraw %}example-enhancer-chart{% raw %}.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "{% endraw %}example-enhancer-chart{% raw %}.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "{% endraw %}example-enhancer-chart{% raw %}.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "{% endraw %}example-enhancer-chart{% raw %}.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          # --- INJECTED APPLICATION ENVIRONMENT VARIABLES ---
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.config.kafka.bootstrapServers | quote }}
            - name: SCHEMA_REGISTRY_URL
              value: {{ .Values.config.kafka.schemaRegistryUrl | quote }}
            - name: MANIFEST_STORAGE_INTERNAL_URL
              value: {{ .Values.config.storage.internalUrl | quote }}
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.config.otel.endpoint }}
            - name: QUARKUS_OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.config.otel.protocol }}
            - name: QUARKUS_OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=sbomer-{% endraw %}example-enhancer{% raw %}"

            - name: SBOMER_ENHANCER_TOOL_NAME
              value: {{ .Values.config.enhancer.tool.name | quote }}
            - name: SBOMER_ENHANCER_TOOL_VERSION
              value: {{ .Values.config.enhancer.tool.version | quote }}
            - name: SBOMER_ENHANCER_SUPPLIER_NAME
              value: {{ .Values.config.enhancer.supplier.name | quote }}
            - name: SBOMER_ENHANCER_SUPPLIER_URLS
              value: {{ .Values.config.enhancer.supplier.urls | quote }}

            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # --------------------------------------------------

          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}{% endraw %}