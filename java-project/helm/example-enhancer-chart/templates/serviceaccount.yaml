{% raw %}{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "{% endraw %}example-enhancer-chart{% raw %}.serviceAccountName" . }}
  labels:
    {{- include "{% endraw %}example-enhancer-chart{% raw %}.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}{% endraw %}